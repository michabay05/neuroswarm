---
type: "RectangularWorld"
size:  # in meters
  - 8
  - 8
time_step: !np 1 / 40  # 0.025 seconds
seed: <{ seed|default(2023) }>
spawners:
  - type: UniformAgentSpawner
    n: <{ n|default(6) }>  # default number of agents BUT may be overridden by user args
    facing: away
    region: [[3.4, 3.4], [3.4, 4.6], [4.6, 4.6], [4.6, 3.4]]
    agent: !include turbopi.yaml
metrics:
  - type: Circliness
    avg_history_max: 450
  - type: DelaunayDiffusion
    show: false
    history_size: 450
  - type: Aggregation
    history_size: 450
  - type: ExplodingDispersion
    history_size: 450
  - type: MovingMass
    history_size: 450
    linear: [1, 1]
  - type: Boids
    linear: [1, 1, 3]
    separation_metric:
      history_size: 450
      # 0.2 - distance between the centers of two agent centers
      # +0.05 - a bit more padding
      linear: [[0.2, !np "0.2+0.1", !np "0.2+2*0.1"], [-1, 0, 1]]
      clamp: [-1, 1]
    cohesion_metric:
      history_size: 450
      linear: [[0.9, 1., 1.1], [1, 0, -1]]
      clamp: [-1, 1]
    alignment_metric:
      history_size: 450
      pre_exponent: 1
      post_exponent: 2
# init_type:
#   type: "RectRandomInit"  # A starting region where agents will spawn at t=0
#   bb:
#     - - 3.4 # X (m) Upper Left Bounding Box Corner
#       - 3.4 # Y
#     - - 4.6 # X (m) Lower Right Bounding Box Corner
#       - 4.6 # Y
#   seed: 2023 # ADD SEED HERE TO ENSURE SAME INITIALIZATION EVERY TIME
# padding: 0
# collide_walls: false  # Use No Environment Walls for this problem
# show_walls: false  # Hide Default Walls,
metadata:
  hash: _hash
stop_at: 1000 # Upper Simulation Limit (timesteps)
